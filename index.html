<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>LifeTracker — Personal Habit Dashboard & Weekly Planner</title>
  <meta name="title" content="LifeTracker — Personal Habit Dashboard & Weekly Planner" />
  <meta name="description"
    content="LifeTracker is a personal productivity dashboard to track daily habits, manage weekly goals, and visualize growth using your own Google Sheets." />
  <meta name="theme-color" content="#0a160f" />
  <meta name="application-name" content="LifeTracker" />
  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="LifeTracker — Your Personal Habit & Wellness Dashboard" />
  <meta property="og:description"
    content="Track daily habits, monitor your cycle, plan weekly goals, and visualize a full year of personal progress." />
  <meta property="og:image" content="/og-image.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/logo.png" />

  <!-- Security headers (belt + suspenders alongside server config) -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="google-site-verification" content="oJtbytfMhvP7e5yu4lG80n2z2pnEehz3Ybyx37aocyQ" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Google API client — loaded async so they don't block render -->
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <div id="root"></div>

  <!-- Static content for Google OAuth Verification Bots -->
  <div style="display:none;" aria-hidden="true">
    <h1>LifeTracker</h1>
    <p>LifeTracker is a personal productivity dashboard that helps you track daily habits, manage weekly planners, and visualize personal growth. All data is stored privately in your own Google Sheet.</p>
    <a href="/privacy">Privacy Policy</a>
    <a href="/terms">Terms of Service</a>
  </div>

  <noscript>
    <div style="padding: 20px; text-align: center;">
      <h1>LifeTracker</h1>
      <p>LifeTracker is a personal productivity dashboard that helps you track daily habits, manage weekly planners, and visualize personal growth. All data is stored privately in your own Google Sheet.</p>
      <p>To use this application, please enable JavaScript or visit our <a href="/privacy">Privacy Policy</a>.</p>
    </div>
  </noscript>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
