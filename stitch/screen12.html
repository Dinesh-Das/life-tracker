<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zen Hub – Daily Check-in</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:#0a160f;display:flex;height:100vh;overflow:hidden}
.sidebar{width:236px;min-width:236px;height:100vh;background:linear-gradient(180deg,#121e17 0%,#0a160f 100%);border-right:1px solid rgba(255,255,255,0.07);display:flex;flex-direction:column;padding:22px 0}
.sb-logo{display:flex;align-items:center;gap:10px;padding:0 20px 24px}
.sb-logo-ic{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#7db89a,#2d4f41);display:flex;align-items:center;justify-content:center}
.sb-logo-ic svg{width:16px;height:16px;fill:none;stroke:#d8e6db;stroke-width:2}
.sb-logo-txt{font-size:15px;font-weight:600;color:#d8e6db}
.sb-nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:500;color:#9ab0a2;text-decoration:none;transition:background 0.2s}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#d8e6db}
.nav-item.active{background:rgba(255,255,255,0.1);color:#d8e6db}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:0.8}
.sb-bottom{padding:0 10px;display:flex;flex-direction:column;gap:2px}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px 14px}
.user-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#4a6358,#2d4f41);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.user-av svg{width:18px;height:18px;fill:#a9cfbc}
.user-nm{font-size:13px;font-weight:500;color:#9ab0a2;flex:1}
.logout-btn{background:none;border:none;cursor:pointer;color:#9ab0a2}
.logout-btn svg{width:17px;height:17px}

/* MAIN with blurred background */
.main{flex:1;height:100vh;overflow:hidden;position:relative;background:linear-gradient(135deg,#c2d9cc 0%,#9bbfaf 35%,#b8d2c6 60%,#8da89b 100%)}
.main::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 55% 45% at 75% 15%,rgba(180,220,200,0.5) 0%,transparent 65%),radial-gradient(ellipse 40% 55% at 15% 85%,rgba(45,79,65,0.25) 0%,transparent 55%);z-index:0}

/* Background content (blurred) */
.bg-content{position:absolute;inset:0;z-index:1;padding:38px 44px;filter:blur(3px);pointer-events:none}
.bg-row{display:flex;gap:18px;margin-bottom:18px}
.bg-card{background:rgba(255,255,255,0.3);border-radius:16px;flex:1;height:120px}

/* Overlay */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,0.15);z-index:2;display:flex;align-items:center;justify-content:center}

/* Modal */
.modal{
  background:linear-gradient(145deg,#f0f7f3,#e4f2ec);
  border-radius:24px;
  padding:40px 44px;
  width:580px;
  max-width:90vw;
  box-shadow:0 20px 60px rgba(0,0,0,0.2);
  position:relative;
}

.modal-title{font-family:'Newsreader',Georgia,serif;font-size:36px;font-weight:600;color:#1a2e24;text-align:center;margin-bottom:8px}
.modal-q{font-family:'Newsreader',Georgia,serif;font-size:22px;font-weight:400;color:#2d4f41;text-align:center;margin-bottom:28px}

/* Emoji mood picker */
.mood-row{display:flex;justify-content:center;gap:12px;margin-bottom:28px}
.mood-btn{
  width:64px;height:64px;border-radius:16px;
  border:2px solid rgba(45,79,65,0.15);
  background:rgba(255,255,255,0.6);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
  transition:all 0.2s;
}
.mood-btn:hover{background:rgba(255,255,255,0.9);border-color:rgba(45,79,65,0.4);}
.mood-btn.selected{background:rgba(255,255,255,0.95);border-color:#3d6b52;box-shadow:0 0 0 3px rgba(61,107,82,0.15)}

/* Gratitude input */
.gratitude-label{font-size:15px;font-weight:600;color:#1a2e24;margin-bottom:12px}
.gratitude-input{
  width:100%;
  padding:16px 18px;
  border:1.5px solid rgba(45,79,65,0.2);
  border-radius:14px;
  background:rgba(255,255,255,0.5);
  font-family:'Manrope',sans-serif;
  font-size:14px;
  color:#3d5a4a;
  resize:none;
  height:90px;
  outline:none;
  margin-bottom:24px;
  transition:border-color 0.2s;
}
.gratitude-input::placeholder{color:#8aaa9a}
.gratitude-input:focus{border-color:rgba(45,79,65,0.5);background:rgba(255,255,255,0.7)}

/* Action buttons */
.action-row{display:flex;gap:14px}
.btn-skip{flex:1;padding:14px;background:#3d5a4a;color:#d8e6db;border:none;border-radius:14px;font-family:'Manrope',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.btn-skip:hover{opacity:0.85}
.btn-submit{flex:1;padding:14px;background:#2d4f41;color:#d8e6db;border:none;border-radius:14px;font-family:'Manrope',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.btn-submit:hover{opacity:0.85}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></div>
    <span class="sb-logo-txt">Zen Hub</span>
  </div>
  <nav class="sb-nav">
    <a class="nav-item active" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><rect x="3" y="4" width="18" height="18" rx="2"/></svg>Daily Check-in</a>
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Planner</a>
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Reflections</a>
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>Focus Mode</a>
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Analytics</a>
  </nav>
  <div class="sb-bottom">
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg>Settings</a>
    <div class="sb-user">
      <div class="user-av"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="#a9cfbc"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" fill="#a9cfbc"/></svg></div>
      <span class="user-nm">Dinesh Das</span>
      <button class="logout-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </div>
</aside>

<main class="main">
  <!-- Blurred background -->
  <div class="bg-content">
    <div class="bg-row">
      <div class="bg-card"></div>
      <div class="bg-card"></div>
      <div class="bg-card"></div>
    </div>
    <div class="bg-row">
      <div class="bg-card"></div>
      <div class="bg-card"></div>
      <div class="bg-card"></div>
    </div>
  </div>

  <!-- Overlay with modal -->
  <div class="overlay">
    <div class="modal">
      <div class="modal-title">Daily Check-in</div>
      <div class="modal-q">How are you feeling today?</div>

      <div class="mood-row">
        <button class="mood-btn selected">🙂</button>
        <button class="mood-btn">😐</button>
        <button class="mood-btn">😟</button>
        <button class="mood-btn">😞</button>
        <button class="mood-btn">😢</button>
      </div>

      <div class="gratitude-label">One thing you're grateful for</div>
      <textarea class="gratitude-input" placeholder="Type your gratitude here..."></textarea>

      <div class="action-row">
        <button class="btn-skip">Skip</button>
        <button class="btn-submit">Submit</button>
      </div>
    </div>
  </div>
</main>
</body>
</html>
