<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zen Hub – Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:#0a160f;display:flex;height:100vh;overflow:hidden}
.sidebar{width:236px;min-width:236px;height:100vh;background:linear-gradient(180deg,#121e17 0%,#0a160f 100%);border-right:1px solid rgba(255,255,255,0.07);display:flex;flex-direction:column;padding:22px 0}
.sb-logo{display:flex;align-items:center;gap:10px;padding:0 20px 24px}
.sb-logo-ic{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#7db89a,#2d4f41);display:flex;align-items:center;justify-content:center}
.sb-logo-ic svg{width:16px;height:16px;fill:none;stroke:#d8e6db;stroke-width:2}
.sb-logo-txt{font-size:15px;font-weight:600;color:#d8e6db}
.sb-nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:500;color:#9ab0a2;text-decoration:none;transition:background 0.2s}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#d8e6db}
.nav-item.active{background:rgba(255,255,255,0.1);color:#d8e6db}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:0.8}
.sb-bottom{padding:0 10px;display:flex;flex-direction:column;gap:2px}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px 14px}
.user-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#4a6358,#2d4f41);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.user-av svg{width:18px;height:18px;fill:#a9cfbc}
.user-nm{font-size:13px;font-weight:500;color:#9ab0a2;flex:1}
.logout-btn{background:none;border:none;cursor:pointer;color:#9ab0a2}
.logout-btn svg{width:17px;height:17px}
.main{flex:1;height:100vh;overflow:hidden;position:relative;background:linear-gradient(135deg,#c2d9cc 0%,#9bbfaf 35%,#b8d2c6 60%,#8da89b 100%)}
.main::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 55% 45% at 75% 15%,rgba(180,220,200,0.5) 0%,transparent 65%),radial-gradient(ellipse 40% 55% at 15% 85%,rgba(45,79,65,0.25) 0%,transparent 55%);z-index:0}
.main-c{position:relative;z-index:1;padding:38px 44px;height:100%;display:flex;flex-direction:column}

.page-title{font-family:'Newsreader',Georgia,serif;font-size:52px;font-weight:700;color:#1a2e24;letter-spacing:-0.02em;text-align:center;margin-bottom:6px}
.page-sub{font-size:16px;color:#3d5a4a;text-align:center;margin-bottom:28px}

.top-row{display:grid;grid-template-columns:1.8fr 1fr;gap:18px;margin-bottom:18px}

.gc{background:linear-gradient(135deg,rgba(255,255,255,0.4) 0%,rgba(255,255,255,0.2) 100%);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.32);border-radius:20px;padding:22px 24px}

.chart-title{font-size:15px;font-weight:700;color:#1a2e24;margin-bottom:16px}

/* SVG Line Chart */
.chart-wrap{position:relative}
.chart-wrap svg{width:100%;height:180px}
.chart-area{fill:url(#greenGrad);opacity:0.3}
.chart-line{fill:none;stroke:#3d6b52;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart-dot{fill:#3d6b52}
.chart-glow{fill:rgba(100,180,130,0.15)}
.chart-labels{display:flex;justify-content:space-around;margin-top:8px}
.chart-label{font-size:12px;color:#5a7a6a;font-weight:500}
.y-labels{position:absolute;left:0;top:0;height:180px;display:flex;flex-direction:column;justify-content:space-between}
.y-label{font-size:11px;color:#7a9a8a}

/* Level up card */
.level-title{font-size:15px;font-weight:700;color:#1a2e24;margin-bottom:10px}
.level-sub{font-size:12px;color:#5a7a6a;margin-bottom:10px}
.level-bar{width:100%;height:10px;background:rgba(0,0,0,0.12);border-radius:9999px;overflow:hidden;margin-bottom:12px}
.level-fill{height:100%;width:45%;background:linear-gradient(90deg,#4a7a62,#6a9a7a);border-radius:9999px}
.xp-sub{font-size:12px;color:#5a7a6a;margin-bottom:16px}
.xp-ring-wrap{display:flex;align-items:center;gap:12px}
.xp-ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.xp-ring svg{transform:rotate(-90deg)}
.xp-ring-label{position:absolute;font-size:10px;font-weight:700;color:#2d4f41;text-align:center;line-height:1.2}
.xp-count{font-size:13px;font-weight:600;color:#3d5a4a}

/* Bottom row */
.bot-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

.habit-stat{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 16px}
.hs-label{font-size:13px;font-weight:600;color:#1a2e24;text-align:center}
.hs-ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.hs-ring svg{transform:rotate(-90deg)}
.hs-pct{position:absolute;font-size:12px;font-weight:700;color:#2d4f41}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></div>
    <span class="sb-logo-txt">Zen Hub</span>
  </div>
  <nav class="sb-nav">
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><rect x="3" y="4" width="18" height="18" rx="2"/></svg>Daily Check-in</a>
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Planner</a>
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Reflections</a>
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>Focus Mode</a>
    <a class="nav-item active" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Analytics</a>
  </nav>
  <div class="sb-bottom">
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg>Settings</a>
    <div class="sb-user">
      <div class="user-av"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="#a9cfbc"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" fill="#a9cfbc"/></svg></div>
      <span class="user-nm">Dinesh Das</span>
      <button class="logout-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </div>
</aside>

<main class="main">
  <div class="main-c">
    <h1 class="page-title">Analytics</h1>
    <p class="page-sub">Sunday, April 26, 2026</p>

    <div class="top-row">
      <!-- Line Chart -->
      <div class="gc">
        <div class="chart-title">Focus Hours (This Week)</div>
        <div class="chart-wrap">
          <svg viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#5a9a70" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="#5a9a70" stop-opacity="0"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <!-- Grid lines -->
            <line x1="40" y1="20" x2="490" y2="20" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
            <line x1="40" y1="55" x2="490" y2="55" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
            <line x1="40" y1="90" x2="490" y2="90" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
            <line x1="40" y1="125" x2="490" y2="125" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
            <!-- Y labels -->
            <text x="30" y="24" text-anchor="end" font-size="10" fill="#5a7a6a">80</text>
            <text x="30" y="59" text-anchor="end" font-size="10" fill="#5a7a6a">60</text>
            <text x="30" y="94" text-anchor="end" font-size="10" fill="#5a7a6a">40</text>
            <text x="30" y="129" text-anchor="end" font-size="10" fill="#5a7a6a">20</text>
            <text x="30" y="155" text-anchor="end" font-size="10" fill="#5a7a6a">0</text>
            <!-- Area fill -->
            <path class="chart-area" d="M50,142 L115,120 L182,128 L249,90 L316,97 L383,72 L450,32 L450,155 L50,155 Z" fill="url(#greenGrad)"/>
            <!-- Glow area -->
            <path d="M50,142 L115,120 L182,128 L249,90 L316,97 L383,72 L450,32" fill="none" stroke="rgba(100,180,130,0.3)" stroke-width="8" filter="url(#glow)"/>
            <!-- Line -->
            <path class="chart-line" d="M50,142 L115,120 L182,128 L249,90 L316,97 L383,72 L450,32"/>
            <!-- Dots -->
            <circle class="chart-dot" cx="50" cy="142" r="4"/>
            <circle class="chart-dot" cx="115" cy="120" r="4"/>
            <circle class="chart-dot" cx="182" cy="128" r="4"/>
            <circle class="chart-dot" cx="249" cy="90" r="4"/>
            <circle class="chart-dot" cx="316" cy="97" r="4"/>
            <circle class="chart-dot" cx="383" cy="72" r="4"/>
            <circle class="chart-dot" cx="450" cy="32" r="4"/>
            <!-- X labels -->
            <text x="50" y="158" text-anchor="middle" font-size="10" fill="#5a7a6a">Mon</text>
            <text x="115" y="158" text-anchor="middle" font-size="10" fill="#5a7a6a">Tue</text>
            <text x="182" y="158" text-anchor="middle" font-size="10" fill="#5a7a6a">Wed</text>
            <text x="249" y="158" text-anchor="middle" font-size="10" fill="#5a7a6a">Thu</text>
            <text x="316" y="158" text-anchor="middle" font-size="10" fill="#5a7a6a">Fri</text>
            <text x="383" y="158" text-anchor="middle" font-size="10" fill="#5a7a6a">Sat</text>
            <text x="450" y="158" text-anchor="middle" font-size="10" fill="#5a7a6a">Sun</text>
          </svg>
        </div>
      </div>

      <!-- Level Up -->
      <div class="gc">
        <div class="level-title">Level Up</div>
        <div class="level-sub">Current Level: 5</div>
        <div class="level-bar"><div class="level-fill"></div></div>
        <div class="xp-sub">XP to Level 6: 450 / 1000</div>
        <div class="xp-ring-wrap">
          <div class="xp-ring">
            <svg width="72" height="72" viewBox="0 0 72 72">
              <circle cx="36" cy="36" r="28" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="5"/>
              <circle cx="36" cy="36" r="28" fill="none" stroke="#4a7a62" stroke-width="5" stroke-dasharray="175.9" stroke-dashoffset="96.75" stroke-linecap="round"/>
            </svg>
            <div class="xp-ring-label">450<br>1000</div>
          </div>
          <span class="xp-count">450 / 1000</span>
        </div>
      </div>
    </div>

    <!-- Bottom stats -->
    <div class="bot-row">
      <div class="gc habit-stat">
        <div class="hs-label">Habit Consistency</div>
        <div class="hs-ring">
          <svg width="80" height="80" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="32" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="5"/>
            <circle cx="40" cy="40" r="32" fill="none" stroke="#4a7a62" stroke-width="5" stroke-dasharray="201.1" stroke-dashoffset="40.2" stroke-linecap="round"/>
          </svg>
          <span class="hs-pct">80%</span>
        </div>
      </div>
      <div class="gc habit-stat">
        <div class="hs-label">Meditation</div>
        <div class="hs-ring">
          <svg width="80" height="80" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="32" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="5"/>
            <circle cx="40" cy="40" r="32" fill="none" stroke="#4a7a62" stroke-width="5" stroke-dasharray="201.1" stroke-dashoffset="40.2" stroke-linecap="round"/>
          </svg>
          <span class="hs-pct">80%</span>
        </div>
      </div>
      <div class="gc habit-stat">
        <div class="hs-label">Reading</div>
        <div class="hs-ring">
          <svg width="80" height="80" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="32" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="5"/>
            <circle cx="40" cy="40" r="32" fill="none" stroke="#4a7a62" stroke-width="5" stroke-dasharray="201.1" stroke-dashoffset="70.4" stroke-linecap="round"/>
          </svg>
          <span class="hs-pct">65%</span>
        </div>
      </div>
      <div class="gc habit-stat">
        <div class="hs-label">Exercise</div>
        <div class="hs-ring">
          <svg width="80" height="80" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="32" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="5"/>
            <circle cx="40" cy="40" r="32" fill="none" stroke="#4a7a62" stroke-width="5" stroke-dasharray="201.1" stroke-dashoffset="20.1" stroke-linecap="round"/>
          </svg>
          <span class="hs-pct">90%</span>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
