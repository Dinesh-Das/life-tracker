<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zen Hub – Habit Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:#0a160f;display:flex;height:100vh;overflow:hidden}

.sidebar{width:236px;min-width:236px;height:100vh;background:linear-gradient(180deg,#121e17 0%,#0a160f 100%);border-right:1px solid rgba(255,255,255,0.07);display:flex;flex-direction:column;padding:22px 0}
.sb-logo{display:flex;align-items:center;gap:10px;padding:0 20px 24px}
.sb-logo-ic{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#7db89a,#2d4f41);display:flex;align-items:center;justify-content:center}
.sb-logo-ic svg{width:16px;height:16px;fill:none;stroke:#d8e6db;stroke-width:2}
.sb-logo-txt{font-size:15px;font-weight:600;color:#d8e6db}
.sb-nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:500;color:#9ab0a2;text-decoration:none;transition:background 0.2s}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#d8e6db}
.nav-item.active{background:rgba(255,255,255,0.1);color:#d8e6db}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:0.8}
.sb-bottom{padding:0 10px;display:flex;flex-direction:column;gap:2px}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px 14px}
.user-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#4a6358,#2d4f41);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.user-av svg{width:18px;height:18px;fill:#a9cfbc}
.user-nm{font-size:13px;font-weight:500;color:#9ab0a2;flex:1}
.logout-btn{background:none;border:none;cursor:pointer;color:#9ab0a2}
.logout-btn svg{width:17px;height:17px}

/* MAIN */
.main{flex:1;height:100vh;overflow-y:auto;position:relative;background:linear-gradient(135deg,#c2d9cc 0%,#9bbfaf 35%,#b8d2c6 60%,#8da89b 100%)}
.main::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 55% 45% at 75% 15%,rgba(180,220,200,0.5) 0%,transparent 65%),radial-gradient(ellipse 40% 55% at 15% 85%,rgba(45,79,65,0.25) 0%,transparent 55%);z-index:0}
.main-c{position:relative;z-index:1;padding:36px 40px}

.page-title{font-family:'Newsreader',Georgia,serif;font-size:46px;font-weight:600;color:#1a2e24;letter-spacing:-0.02em;margin-bottom:28px}

.habits-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}

.habit-card{
  background:linear-gradient(135deg,rgba(255,255,255,0.35) 0%,rgba(255,255,255,0.15) 100%);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:16px;
  padding:24px 24px 20px;
  display:flex;
  flex-direction:column;
  gap:14px;
  position:relative;
}

.habit-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.habit-name{font-family:'Newsreader',Georgia,serif;font-size:30px;font-weight:600;color:#1a2e24;line-height:1.15;flex:1}

/* Circle progress */
.cp-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.cp-wrap svg{transform:rotate(-90deg)}
.cp-label{position:absolute;font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;color:#2d4a3a;text-align:center;white-space:nowrap}

/* Badge */
.habit-badge{
  display:inline-flex;align-items:center;padding:5px 14px;border-radius:9999px;
  background:rgba(45,79,65,0.65);color:#a9cfbc;
  font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;
  width:fit-content;
}

/* FAB */
.fab{
  position:fixed;bottom:28px;right:32px;
  width:54px;height:54px;border-radius:50%;
  background:#3d5a4a;
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,0,0,0.25);
  color:#d8e6db;
  font-size:26px;font-weight:300;
  z-index:10;
  transition:transform 0.2s;
}
.fab:hover{transform:scale(1.08)}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></div>
    <span class="sb-logo-txt">Zen Hub</span>
  </div>
  <nav class="sb-nav">
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><rect x="3" y="4" width="18" height="18" rx="2"/></svg>Daily Check-in</a>
    <a class="nav-item active" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Planner</a>
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Reflections</a>
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>Focus Mode</a>
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Analytics</a>
  </nav>
  <div class="sb-bottom">
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg>Settings</a>
    <div class="sb-user">
      <div class="user-av"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="#a9cfbc"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" fill="#a9cfbc"/></svg></div>
      <span class="user-nm">Dinesh Das</span>
      <button class="logout-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </div>
</aside>

<main class="main">
  <div class="main-c">
    <h1 class="page-title">Habit Inventory</h1>

    <div class="habits-grid">

      <!-- Wake Up Early 80% -->
      <div class="habit-card">
        <div class="habit-top">
          <div class="habit-name">Wake Up<br>Early</div>
          <div class="cp-wrap">
            <svg width="76" height="76" viewBox="0 0 76 76">
              <circle cx="38" cy="38" r="30" fill="none" stroke="rgba(45,79,65,0.2)" stroke-width="5"/>
              <circle cx="38" cy="38" r="30" fill="none" stroke="#4a7a62" stroke-width="5" stroke-dasharray="188.5" stroke-dashoffset="37.7" stroke-linecap="round"/>
            </svg>
            <span class="cp-label">80%</span>
          </div>
        </div>
        <span class="habit-badge">Health</span>
      </div>

      <!-- Workout 60% -->
      <div class="habit-card">
        <div class="habit-top">
          <div class="habit-name">Workout</div>
          <div class="cp-wrap">
            <svg width="76" height="76" viewBox="0 0 76 76">
              <circle cx="38" cy="38" r="30" fill="none" stroke="rgba(45,79,65,0.2)" stroke-width="5"/>
              <circle cx="38" cy="38" r="30" fill="none" stroke="#4a7a62" stroke-width="5" stroke-dasharray="188.5" stroke-dashoffset="75.4" stroke-linecap="round"/>
            </svg>
            <span class="cp-label">60%</span>
          </div>
        </div>
        <span class="habit-badge">Fitness</span>
      </div>

      <!-- Read 50% -->
      <div class="habit-card">
        <div class="habit-top">
          <div class="habit-name">Read (30<br>pages)</div>
          <div class="cp-wrap">
            <svg width="76" height="76" viewBox="0 0 76 76">
              <circle cx="38" cy="38" r="30" fill="none" stroke="rgba(45,79,65,0.2)" stroke-width="5"/>
              <circle cx="38" cy="38" r="30" fill="none" stroke="#4a7a62" stroke-width="5" stroke-dasharray="188.5" stroke-dashoffset="94.25" stroke-linecap="round"/>
            </svg>
            <span class="cp-label">50%</span>
          </div>
        </div>
        <span class="habit-badge">Personal Development</span>
      </div>

      <!-- Meditate 100% -->
      <div class="habit-card">
        <div class="habit-top">
          <div class="habit-name">Meditate<br>(10 min)</div>
          <div class="cp-wrap">
            <svg width="76" height="76" viewBox="0 0 76 76">
              <circle cx="38" cy="38" r="30" fill="none" stroke="rgba(45,79,65,0.2)" stroke-width="5"/>
              <circle cx="38" cy="38" r="30" fill="none" stroke="#4a7a62" stroke-width="5" stroke-dasharray="188.5" stroke-dashoffset="0" stroke-linecap="round"/>
            </svg>
            <span class="cp-label">100%</span>
          </div>
        </div>
        <span class="habit-badge">Mindfulness</span>
      </div>

      <!-- Row 3 partial -->
      <div class="habit-card">
        <div class="habit-top">
          <div class="habit-name">Deep<br>Work</div>
          <div class="cp-wrap">
            <svg width="76" height="76" viewBox="0 0 76 76">
              <circle cx="38" cy="38" r="30" fill="none" stroke="rgba(45,79,65,0.2)" stroke-width="5"/>
              <circle cx="38" cy="38" r="30" fill="none" stroke="#4a7a62" stroke-width="5" stroke-dasharray="188.5" stroke-dashoffset="56.55" stroke-linecap="round"/>
            </svg>
            <span class="cp-label">70%</span>
          </div>
        </div>
        <span class="habit-badge">Productivity</span>
      </div>

      <div class="habit-card">
        <div class="habit-top">
          <div class="habit-name">Meditate</div>
          <div class="cp-wrap">
            <svg width="76" height="76" viewBox="0 0 76 76">
              <circle cx="38" cy="38" r="30" fill="none" stroke="rgba(45,79,65,0.2)" stroke-width="5"/>
              <circle cx="38" cy="38" r="30" fill="none" stroke="#4a7a62" stroke-width="5" stroke-dasharray="188.5" stroke-dashoffset="113.1" stroke-linecap="round"/>
            </svg>
            <span class="cp-label">40%</span>
          </div>
        </div>
        <span class="habit-badge">Mindfulness</span>
      </div>

    </div>
  </div>
</main>

<button class="fab">+</button>
</body>
</html>
