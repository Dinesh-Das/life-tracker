<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeTracker – Focus Mode</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:#0a160f;display:flex;height:100vh;overflow:hidden}
.sidebar{width:236px;min-width:236px;height:100vh;background:linear-gradient(180deg,#121e17 0%,#0a160f 100%);border-right:1px solid rgba(255,255,255,0.07);display:flex;flex-direction:column;padding:22px 0;position:relative;z-index:2}
.sb-logo{display:flex;align-items:center;gap:10px;padding:0 20px 24px}
.sb-logo-ic{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#7db89a,#2d4f41);display:flex;align-items:center;justify-content:center}
.sb-logo-ic svg{width:16px;height:16px;fill:none;stroke:#d8e6db;stroke-width:2}
.sb-logo-txt{font-size:15px;font-weight:600;color:#d8e6db}
.sb-nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:500;color:#9ab0a2;text-decoration:none;transition:background 0.2s}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#d8e6db}
.nav-item.active{background:rgba(255,255,255,0.1);color:#d8e6db}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:0.8}
.sb-bottom{padding:0 10px;display:flex;flex-direction:column;gap:2px}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px 14px}
.user-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#4a6358,#2d4f41);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.user-av svg{width:18px;height:18px;fill:#a9cfbc}
.user-nm{font-size:13px;font-weight:500;color:#9ab0a2;flex:1}
.logout-btn{background:none;border:none;cursor:pointer;color:#9ab0a2}
.logout-btn svg{width:17px;height:17px}

/* MAIN – full green ambient background */
.main{
  flex:1;height:100vh;overflow:hidden;position:relative;
  background:radial-gradient(ellipse 80% 80% at 50% 40%, #5a9870 0%, #3a7055 20%, #1e4a30 50%, #0d2018 100%);
}

/* Ambient glow blobs */
.main::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 60% 60% at 50% 35%, rgba(100,200,140,0.2) 0%, transparent 65%),
    radial-gradient(ellipse 40% 40% at 30% 70%, rgba(60,140,90,0.15) 0%, transparent 60%),
    radial-gradient(ellipse 35% 35% at 75% 60%, rgba(80,180,110,0.12) 0%, transparent 55%);
  z-index:0;
}

.main-c{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0}

/* Timer ring */
.timer-wrap{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:32px}

.timer-ring{filter:drop-shadow(0 0 32px rgba(160,230,190,0.25))}

.timer-inner{
  position:absolute;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  width:240px;height:240px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(200,240,220,0.95) 0%, rgba(180,225,205,0.9) 100%);
  box-shadow:inset 0 0 40px rgba(100,180,130,0.15);
}

.timer-time{
  font-family:'Manrope',sans-serif;
  font-size:56px;font-weight:700;
  color:#1a2e24;
  letter-spacing:-0.02em;
  line-height:1;
}

.timer-label{
  font-size:14px;font-weight:500;color:#3d5a4a;margin-top:6px;
}

/* Session label pill */
.session-pill{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:14px;
  padding:16px 40px;
  font-family:'Newsreader',Georgia,serif;
  font-size:28px;font-weight:600;color:#d8e6db;
  margin-bottom:24px;
}

/* Exit button */
.exit-btn{
  padding:14px 44px;
  background:transparent;
  border:1.5px solid rgba(200,240,210,0.5);
  border-radius:9999px;
  font-family:'Manrope',sans-serif;
  font-size:15px;font-weight:600;color:#c8e0d0;
  cursor:pointer;transition:all 0.2s;
}
.exit-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(200,240,210,0.7)}

/* XP Bar (vertical, right side) */
.xp-bar-container{
  position:absolute;right:60px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.xp-track{
  width:14px;height:200px;
  background:rgba(255,255,255,0.1);
  border-radius:9999px;overflow:hidden;
  position:relative;
}
.xp-fill{
  position:absolute;bottom:0;left:0;right:0;
  height:30%;
  background:linear-gradient(180deg,#a0e0b8 0%,#4a9a6a 100%);
  border-radius:9999px;
  box-shadow:0 0 12px rgba(100,200,140,0.5);
}
/* Particle dots alongside xp bar */
.xp-dot{
  position:absolute;right:-8px;
  width:6px;height:6px;border-radius:50%;
  background:#a0e0b8;opacity:0.6;
  animation:floatUp 2s ease-in-out infinite;
}
@keyframes floatUp{0%,100%{transform:translateY(0);opacity:0.6}50%{transform:translateY(-8px);opacity:1}}

.xp-label-text{
  font-size:13px;font-weight:600;color:#a0c8b0;text-align:center;line-height:1.4;
}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></div>
    <span class="sb-logo-txt">LifeTracker</span>
  </div>
  <nav class="sb-nav">
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><rect x="3" y="4" width="18" height="18" rx="2"/></svg>Daily Check-in</a>
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Planner</a>
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Reflections</a>
    <a class="nav-item active" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>Focus Mode</a>
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Analytics</a>
  </nav>
  <div class="sb-bottom">
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg>Settings</a>
    <div class="sb-user">
      <div class="user-av"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="#a9cfbc"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" fill="#a9cfbc"/></svg></div>
      <span class="user-nm">Dinesh Das</span>
      <button class="logout-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </div>
</aside>

<main class="main">
  <div class="main-c">
    <!-- Timer -->
    <div class="timer-wrap">
      <!-- Outer ring SVG -->
      <svg class="timer-ring" width="300" height="300" viewBox="0 0 300 300">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(180,230,200,0.5)"/>
            <stop offset="100%" stop-color="rgba(100,180,130,0.2)"/>
          </linearGradient>
          <filter id="ringGlow">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <!-- Outer glow track -->
        <circle cx="150" cy="150" r="140" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="3"/>
        <!-- Active arc (very small segment near top, ~2% filled = counting down from 25min) -->
        <circle cx="150" cy="150" r="140" fill="none" stroke="rgba(200,240,220,0.55)" stroke-width="3"
          stroke-dasharray="879.6" stroke-dashoffset="860" stroke-linecap="round"
          transform="rotate(-90 150 150)" filter="url(#ringGlow)"/>
        <!-- Inner ring -->
        <circle cx="150" cy="150" r="128" fill="rgba(180,225,205,0.06)" stroke="rgba(200,240,210,0.15)" stroke-width="1.5"/>
      </svg>

      <!-- Timer face -->
      <div class="timer-inner">
        <div class="timer-time">25:00</div>
        <div class="timer-label">Counting down</div>
      </div>
    </div>

    <!-- Session label -->
    <div class="session-pill">Deep Work Session</div>

    <!-- Exit button -->
    <button class="exit-btn">Exit Focus Mode</button>
  </div>

  <!-- XP bar on right -->
  <div class="xp-bar-container">
    <div class="xp-label-text">XP Earned:<br>150/500</div>
    <div class="xp-track">
      <div class="xp-fill"></div>
      <div class="xp-dot" style="top:60%;animation-delay:0s"></div>
      <div class="xp-dot" style="top:45%;animation-delay:0.6s"></div>
      <div class="xp-dot" style="top:72%;animation-delay:1.2s"></div>
    </div>
  </div>
</main>
</body>
</html>
