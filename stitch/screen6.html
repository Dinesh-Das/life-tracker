<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zen Hub – Cycle & Wellness Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:#0a160f;display:flex;height:100vh;overflow:hidden}
.sidebar{width:236px;min-width:236px;height:100vh;background:linear-gradient(180deg,#121e17 0%,#0a160f 100%);border-right:1px solid rgba(255,255,255,0.07);display:flex;flex-direction:column;padding:22px 0}
.sb-logo{display:flex;align-items:center;gap:10px;padding:0 20px 24px}
.sb-logo-ic{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#7db89a,#2d4f41);display:flex;align-items:center;justify-content:center}
.sb-logo-ic svg{width:16px;height:16px;fill:none;stroke:#d8e6db;stroke-width:2}
.sb-logo-txt{font-size:15px;font-weight:600;color:#d8e6db}
.sb-nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:500;color:#9ab0a2;text-decoration:none;transition:background 0.2s}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#d8e6db}
.nav-item.active{background:rgba(255,255,255,0.1);color:#d8e6db}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:0.8}
.sb-bottom{padding:0 10px;display:flex;flex-direction:column;gap:2px}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px 14px}
.user-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#4a6358,#2d4f41);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.user-av svg{width:18px;height:18px;fill:#a9cfbc}
.user-nm{font-size:13px;font-weight:500;color:#9ab0a2;flex:1}
.logout-btn{background:none;border:none;cursor:pointer;color:#9ab0a2}
.logout-btn svg{width:17px;height:17px}

.main{flex:1;height:100vh;overflow:hidden;position:relative;background:linear-gradient(135deg,#c2d9cc 0%,#9bbfaf 35%,#b8d2c6 60%,#8da89b 100%)}
.main::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 55% 45% at 75% 15%,rgba(180,220,200,0.5) 0%,transparent 65%),radial-gradient(ellipse 40% 55% at 15% 85%,rgba(45,79,65,0.25) 0%,transparent 55%);z-index:0}
.main-c{position:relative;z-index:1;padding:36px 40px;height:100%;display:flex;flex-direction:column}

.page-title{font-family:'Newsreader',Georgia,serif;font-size:44px;font-weight:700;color:#1a2e24;letter-spacing:-0.02em;text-align:center;margin-bottom:4px}
.page-sub{font-size:15px;color:#3d5a4a;text-align:center;margin-bottom:28px}

.content-row{display:grid;grid-template-columns:1fr 0.55fr;gap:20px;flex:1;min-height:0}

/* Calendar Card */
.gc{background:linear-gradient(135deg,rgba(255,255,255,0.4) 0%,rgba(255,255,255,0.2) 100%);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.32);border-radius:20px;padding:24px 28px}

.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.cal-header-title{font-size:18px;font-weight:700;color:#1a2e24}
.cal-nav{display:flex;align-items:center;gap:12px}
.cal-nav-btn{background:none;border:none;cursor:pointer;color:#3d5a4a;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;transition:background 0.2s}
.cal-nav-btn:hover{background:rgba(0,0,0,0.07)}
.cal-nav-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.cal-month{font-size:15px;font-weight:600;color:#1a2e24}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day-name{font-size:12px;font-weight:600;color:#5a7a6a;text-align:center;padding:4px 0}
.cal-day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
  transition:all 0.15s;color:#1a2e24;
  background:rgba(255,255,255,0.3);
}
.cal-day.empty{background:transparent;cursor:default}
.cal-day.period{background:rgba(230,80,100,0.25);color:#c0304a}
.cal-day.period-dark{background:rgba(230,80,100,0.45);color:#b02040}
.cal-day.ovulation{background:rgba(180,100,200,0.2);color:#8040a0}
.cal-day.follicular{background:rgba(100,160,220,0.25);color:#2060a0}
.cal-day.luteal{background:rgba(255,200,100,0.3);color:#9a6010}
.cal-day.today{outline:2px solid #4a7a62;outline-offset:1px}

/* Cycle Gauge Card */
.cycle-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.cycle-card-title{font-size:18px;font-weight:700;color:#1a2e24;margin-bottom:24px;align-self:flex-start}

.gauge-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;margin-bottom:8px}
.gauge-wrap svg{overflow:visible}
.gauge-label{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.gauge-day-txt{font-size:10px;font-weight:700;color:#5a7a6a;letter-spacing:0.08em;text-transform:uppercase}
.gauge-day-num{font-size:40px;font-weight:700;color:#1a2e24;line-height:1}
.gauge-flower{font-size:22px}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></div>
    <span class="sb-logo-txt">Zen Hub</span>
  </div>
  <nav class="sb-nav">
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><rect x="3" y="4" width="18" height="18" rx="2"/></svg>Daily Check-in</a>
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Planner</a>
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Reflections</a>
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>Focus Mode</a>
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Analytics</a>
    <a class="nav-item active" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>Cycle Tracker</a>
  </nav>
  <div class="sb-bottom">
    <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg>Settings</a>
    <div class="sb-user">
      <div class="user-av"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="#a9cfbc"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" fill="#a9cfbc"/></svg></div>
      <span class="user-nm">Dinesh Das</span>
      <button class="logout-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </div>
</aside>

<main class="main">
  <div class="main-c">
    <h1 class="page-title">Cycle & Wellness Tracker</h1>
    <p class="page-sub">Sunday, April 26, 2026</p>

    <div class="content-row">
      <!-- Calendar -->
      <div class="gc">
        <div class="cal-header">
          <span class="cal-header-title">Cycle Calendar</span>
          <div class="cal-nav">
            <button class="cal-nav-btn"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
            <span class="cal-month">April 2026</span>
            <button class="cal-nav-btn"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
          </div>
        </div>
        <div class="cal-grid">
          <!-- Day names -->
          <div class="cal-day-name">M</div>
          <div class="cal-day-name">T</div>
          <div class="cal-day-name">W</div>
          <div class="cal-day-name">T</div>
          <div class="cal-day-name">F</div>
          <div class="cal-day-name">S</div>
          <div class="cal-day-name">S</div>
          <!-- April 2026: starts Tuesday -->
          <div class="cal-day empty"></div>
          <div class="cal-day period-dark">1</div>
          <div class="cal-day period">2</div>
          <div class="cal-day period-dark">3</div>
          <div class="cal-day period">4</div>
          <div class="cal-day period">5</div>
          <!-- Row 2 -->
          <div class="cal-day period">6</div>
          <div class="cal-day period">7</div>
          <div class="cal-day ovulation">8</div>
          <div class="cal-day ovulation">9</div>
          <div class="cal-day ovulation">10</div>
          <div class="cal-day ovulation">11</div>
          <div class="cal-day follicular">12</div>
          <!-- Row 3 -->
          <div class="cal-day follicular">13</div>
          <div class="cal-day follicular">14</div>
          <div class="cal-day follicular">15</div>
          <div class="cal-day follicular">16</div>
          <div class="cal-day follicular">17</div>
          <div class="cal-day follicular">18</div>
          <div class="cal-day luteal">19</div>
          <!-- Row 4 -->
          <div class="cal-day">20</div>
          <div class="cal-day">21</div>
          <div class="cal-day">22</div>
          <div class="cal-day">23</div>
          <div class="cal-day">24</div>
          <div class="cal-day">25</div>
          <div class="cal-day today">26</div>
        </div>
      </div>

      <!-- Current Cycle -->
      <div class="gc cycle-card">
        <div class="cycle-card-title">Current Cycle</div>
        <div class="gauge-wrap">
          <!-- Semi-circle gauge, 180° arc -->
          <svg width="200" height="120" viewBox="0 0 200 120">
            <defs>
              <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#f0a040"/>
                <stop offset="100%" stop-color="#f8c060"/>
              </linearGradient>
              <filter id="gaugeGlow">
                <feGaussianBlur stdDeviation="4" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <!-- Track -->
            <path d="M 15 110 A 85 85 0 0 1 185 110" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="10" stroke-linecap="round"/>
            <!-- Fill ~75% of semi-circle -->
            <path d="M 15 110 A 85 85 0 0 1 185 110" fill="none" stroke="url(#gaugeGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="267" stroke-dashoffset="67" filter="url(#gaugeGlow)"/>
            <!-- Dot at end -->
            <circle cx="178" cy="78" r="6" fill="#f8c060" filter="url(#gaugeGlow)"/>
          </svg>
          <div class="gauge-label" style="top:36px">
            <span class="gauge-day-txt">CYCLE DAY</span>
            <span class="gauge-day-num">53</span>
          </div>
        </div>
        <div class="gauge-flower">🌸</div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
